<svg xmlns="http://www.w3.org/2000/svg" width="900" height="496" viewBox="0 0 900 496" role="img" aria-labelledby="title description">
<title id="title">Throughput with 3 workers</title>
<desc id="description">Successful HTTP 200 requests per second. Higher is better.</desc>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
.heading { fill: #f0f6fc; font-size: 17px; font-weight: 600; }
.label { fill: #c9d1d9; font-size: 13px; }
.muted { fill: #8b949e; font-size: 11px; }
.grid { stroke: #30363d; stroke-dasharray: 3 5; }
.bar { fill: #245493; }
</style>
<rect width="900" height="496" rx="8" fill="#0d1117"/>
<text class="heading" x="30" y="32">Throughput with 3 workers</text>
<text class="label" x="30" y="57">Successful HTTP 200 requests per second. Higher is better.</text>
<line class="grid" x1="150.00" y1="92" x2="150.00" y2="388"/>
<text class="muted" x="150.00" y="412" text-anchor="middle">0</text>
<line class="grid" x1="305.00" y1="92" x2="305.00" y2="388"/>
<text class="muted" x="305.00" y="412" text-anchor="middle">20,000</text>
<line class="grid" x1="460.00" y1="92" x2="460.00" y2="388"/>
<text class="muted" x="460.00" y="412" text-anchor="middle">40,000</text>
<line class="grid" x1="615.00" y1="92" x2="615.00" y2="388"/>
<text class="muted" x="615.00" y="412" text-anchor="middle">60,000</text>
<line class="grid" x1="770.00" y1="92" x2="770.00" y2="388"/>
<text class="muted" x="770.00" y="412" text-anchor="middle">80,000</text>
<g data-framework="starlette">
<title>Starlette: 66,991.52 requests/s</title>
<text class="label" x="138" y="127" text-anchor="end">Starlette</text>
<rect class="bar" x="150" y="100" width="519.18" height="44" rx="6"/>
<text class="label" x="679.18" y="127">66,991.52</text>
</g>
<g data-framework="orionis-rsgi">
<title>Orionis RSGI: 57,941.98 requests/s</title>
<text class="label" x="138" y="187" text-anchor="end">Orionis RSGI</text>
<rect class="bar" x="150" y="160" width="449.05" height="44" rx="6"/>
<text class="label" x="609.05" y="187">57,941.98</text>
</g>
<g data-framework="orionis-asgi">
<title>Orionis ASGI: 57,353.53 requests/s</title>
<text class="label" x="138" y="247" text-anchor="end">Orionis ASGI</text>
<rect class="bar" x="150" y="220" width="444.49" height="44" rx="6"/>
<text class="label" x="604.49" y="247">57,353.53</text>
</g>
<g data-framework="litestar">
<title>Litestar: 52,807.45 requests/s</title>
<text class="label" x="138" y="307" text-anchor="end">Litestar</text>
<rect class="bar" x="150" y="280" width="409.26" height="44" rx="6"/>
<text class="label" x="569.26" y="307">52,807.45</text>
</g>
<g data-framework="fastapi">
<title>FastAPI: 41,510.38 requests/s</title>
<text class="label" x="138" y="367" text-anchor="end">FastAPI</text>
<rect class="bar" x="150" y="340" width="321.71" height="44" rx="6"/>
<text class="label" x="481.71" y="367">41,510.38</text>
</g>
<text class="muted" x="30" y="442">Median of 3 x 10s | 100 connections | 2s warmup</text>
<text class="muted" x="30" y="462">Python 3.14.8 | Granian 2.8.4 | Commit c9adbab | 2026-10-29</text>
<text class="muted" x="30" y="482">Hello World microbenchmark; GitHub-hosted runner performance varies.</text>
