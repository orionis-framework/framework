{% extends "layouts/app.html" %}

{% block title %}
{{ __('Login') }}
{% endblock %}

{% block content %}
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="text-center mb-4">
        <a href="{{ url('/') }}" aria-label="{{ config('app.name') }}" class="navbar-brand navbar-brand-autodark">
          <img src="{{ asset('images/logo.png') }}" alt="{{ config('app.name') }}" style="height: 60px;">
        </a>
      </div>
      <div class="card card-md">
        <div class="card-body">
          <h2 class="h2 text-center mb-4">{{ __('Login to your account') }}</h2>
          <form action="{{ route('login') }}" method="post" autocomplete="off" novalidate="">
            {% csrf %}
            <div class="mb-3">
              <label for="email" class="form-label">{{ __('Email address') }}</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="{{ __('your@email.com') }}" autocomplete="off" value="{{ old('email') }}">
            </div>
            <div class="mb-2">
              <label for="password" class="form-label">
                {{ __('Password') }}
                <span class="form-label-description">
                  <a href="{{ url('/forgot-password') }}">{{ __('I forgot password') }}</a>
                </span>
              </label>
              <div class="input-group input-group-flat">
                <input type="password" id="password" name="password" class="form-control" placeholder="{{ __('Your password') }}" autocomplete="off">
                <span class="input-group-text">
                  <a href="#" class="link-secondary" data-password-toggle="password" data-label-show="{{ __('Show password') }}" data-label-hide="{{ __('Hide password') }}" title="{{ __('Show password') }}" aria-label="{{ __('Show password') }}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-2" data-password-icon="show">
                      <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                      <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path>
                      <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"></path>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-2 d-none" data-password-icon="hide">
                      <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                      <path d="M10.585 10.587a2 2 0 0 0 2.829 2.828"></path>
                      <path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87"></path>
                      <path d="M3 3l18 18"></path>
                    </svg>
                  </a>
                </span>
              </div>
            </div>
            <div class="mb-2">
              <label class="form-check">
                <input type="checkbox" name="remember" class="form-check-input">
                <span class="form-check-label">{{ __('Remember me on this device') }}</span>
              </label>
            </div>
            <div class="form-footer">
              <button type="submit" class="btn btn-primary w-100">{{ __('Sign in') }}</button>
            </div>
          </form>
        </div>
      </div>
      <div class="text-center text-secondary mt-3">{{ __("Don't have account yet?") }} <a href="{{ url('/sign-up') }}" tabindex="-1">{{ __('Sign up') }}</a></div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script src="{{ asset('js/auth.js') }}"></script>
{% endblock %}
