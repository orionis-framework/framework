<text class="label" x="473.16" y="367">20,203.61</text>
</g>
<text class="muted" x="30" y="442">Median of 3 x 10s | 100 connections | 2s warmup</text>
<text class="muted" x="30" y="462">Python 3.14.8 | Granian 2.8.4 | Commit d3e0ca8 | 2026-10-27</text>
