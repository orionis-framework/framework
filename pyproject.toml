[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "app*",
    "bootstrap*",
    "benchmarks*",
    "config*",
    "database*",
    "docs*",
    "resources",
    "routes*",
    "storage*",
    "tests*",
    ".github*",
    ".venv*",
    ".vscode*",
    ".ruff_cache*",
    ".env*",
    "*.ps1"
]

[project]
name = "orionis"
version = "1.0.12"
description = "Orionis Framework — Async-first full-stack framework for modern Python applications."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENCE"]

authors = [
    { name = "Raul Mauricio Uñate Castro", email = "raulmauriciounate@gmail.com" },
]

keywords = [
    "orionis",
    "async framework",
    "asgi framework",
    "rsgi framework",
    "asyncio",
    "dependency injection",
    "service container",
    "service providers",
    "facades",
    "mvc",
    "full stack framework",
    "web framework",
    "api framework",
    "websockets",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
]

dependencies = [
    "aiocache[redis,memcached]>=0.12.3",
    "aiosqlite>=0.22.1",
    "anyio>=4.15.1",
    "apscheduler>=3.11.3,<4.0",
    "cryptography>=50.0.1,<51.0",
    "defusedxml>=0.7.1,<1.0",
    "dotty-dict>=1.3.1,<2.0",
    "faker>=40.40.0,<41.0",
    "filelock>=4.0.1",
    "granian[dotenv,pname,reload,uvloop,winloop]>=2.8.3,<3.0",
    "jinja2>=3.1.6,<4.0",
    "markdown>=3.10.3,<4.0",
    "markupsafe>=3.0.3",
    "msgspec>=0.21.1",
    "pendulum>=3.2.0,<4.0",
    "psutil>=7.2.2,<8.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "python-dotenv>=1.2.3,<2.0",
    "redis[hiredis]>=8.1.0",
    "rich>=15.0.0,<16.0",
    "sqlalchemy[asyncio]>=2.0.54,<3.0",
    "uritemplate>=4.2.0,<5.0",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",
]

[project.scripts]
orionis = "orionis.console.cli:main"

[project.urls]
Homepage = "https://github.com/orionis-framework/framework"
Documentation = "https://orionis-framework.com/"
Repository = "https://github.com/orionis-framework/framework"

[project.optional-dependencies]
# Optional cloud storage SDKs, grouped by provider.
# Install the corresponding extra, for example: uv add 'orionis[s3]'.
s3 = [
    "boto3>=1.43.99",
]
azure = [
    "azure-storage-blob>=12.30.2",
]
gcs = [
    "google-cloud-storage>=3.14.1",
]
# Aggregate extra for all supported cloud storage backends.
storage = [
    "boto3>=1.43.99",
    "azure-storage-blob>=12.30.2",
    "google-cloud-storage>=3.14.1",
]

# Optional database drivers and dialects for non-SQLite backends.
# Each backend extra supports database connections and scheduler job stores.
# SQLite support is included in the core dependencies through aiosqlite.
# Install the corresponding extra, for example: uv add 'orionis[pgsql]'.
mysql = [
    "aiomysql>=0.3.2",
    "pymysql>=1.2.3",
]
pgsql = [
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.13",
]
oracle = [
    "oracledb>=26.0.0",
]
sqlserver = [
    "aioodbc>=0.5.0",
    "pyodbc>=5.3.0",
]
redshift = [
    "redshift-connector>=2.1.17,<3.0",
    "sqlalchemy-redshift>=1.0.0,<2.0",
]
# Aggregate extra for all supported optional database backends.
database = [
    "aiomysql>=0.3.2",
    "pymysql>=1.2.3",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.13",
    "oracledb>=26.0.0",
    "aioodbc>=0.5.0",
    "pyodbc>=5.3.0",
    "redshift-connector>=2.1.17,<3.0",
    "sqlalchemy-redshift>=1.0.0,<2.0",
]

# Development, documentation and benchmark tooling; not package extras.
[dependency-groups]
benchmark = [
    "fastapi==0.143.1",
    "granian==2.8.4",
    "litestar==2.24.0",
    "starlette==1.8.0",
]
dev = [
    "coverage>=7.16.1",
    "ruff>=0.17.1",
    "setuptools>=84.0.0",
]
docs = [
    "pydoctor>=25.10.1",
]

# Descriptions used by the Orionis package installation command.
[tool.orionis.packages]
"extra:s3" = "Amazon S3 file storage."
"extra:azure" = "Azure Blob file storage."
"extra:gcs" = "Google Cloud file storage."
"extra:storage" = "All cloud storage backends."
"extra:mysql" = "MySQL and MariaDB connections."
"extra:pgsql" = "PostgreSQL connections."
"extra:oracle" = "Oracle Database connections."
"extra:sqlserver" = "Microsoft SQL Server connections."
"extra:redshift" = "Amazon Redshift connections."
"extra:database" = "All optional database drivers."
"group:benchmark" = "HTTP framework performance comparisons."
"group:dev" = "Development and quality checks."
"group:docs" = "API reference generation."

# Pydoctor reads this table independently of the PEP 621 project metadata.
# The display name and link targets must therefore be configured explicitly.
# DOCS.ps1 supplies the version from [project] and source links for the Git revision.
[tool.pydoctor]
project-name = "Orionis"
project-url = "https://orionis-framework.com/"
add-package = ["orionis"]
html-output = "docs"
html-viewsource-base = "https://github.com/orionis-framework/framework/tree/master"
docformat = "numpy"
theme = "base"
template-dir = ["resources/docs/pydoctor/templates"]
privacy = ["PUBLIC:**"]
intersphinx = ["https://docs.python.org/3/objects.inv"]
sidebar-expand-depth = 2
sidebar-toc-depth = 3
use-hardlinks = true
