name: Orionis Framework - Test Suite

on:
  push:
    branches:
      - 1.x
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🦀 Install uv
        uses: astral-sh/setup-uv@v3

      - name: 🐍 Set Python Version
        run: uv python install 3.14

      - name: 📦 Sync Dependencies
        run: uv sync

      - name: 🔍 Lint Orionis
        run: uv run ruff check ./orionis/ --statistics

      - name: 🧪 Run All Test Suites
        run: uv run python -B .github/scripts/run_tests.py
