<line class="grid" x1="305.00" y1="92" x2="305.00" y2="388"/>
<text class="muted" x="305.00" y="412" text-anchor="middle">8,000</text>
<line class="grid" x1="460.00" y1="92" x2="460.00" y2="388"/>
<text class="muted" x="460.00" y="412" text-anchor="middle">16,000</text>
