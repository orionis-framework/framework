# Keep file-specific exceptions in explicit source headers, not global path patterns.
[lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "D100",
    "D101",
    "D104",
    "I001",
    "I002",
    "INP001",
    "N802",
    "N818",
    "PLR0917",
    "TRY300",
    "TRY301",
]
exclude = [
    "test/*",
]

[lint.pydocstyle]
convention = "numpy"
