<svg xmlns="http://www.w3.org/2000/svg" width="900" height="496" viewBox="0 0 900 496" role="img" aria-labelledby="title description">
<title id="title">Throughput with 1 worker</title>
<desc id="description">Successful HTTP 200 requests per second. Higher is better.</desc>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
.heading { fill: #f0f6fc; font-size: 17px; font-weight: 600; }
.label { fill: #c9d1d9; font-size: 13px; }
.muted { fill: #8b949e; font-size: 11px; }
.grid { stroke: #30363d; stroke-dasharray: 3 5; }
.bar { fill: #245493; }
</style>
<rect width="900" height="496" rx="8" fill="#0d1117"/>
<text class="heading" x="30" y="32">Throughput with 1 worker</text>
<text class="label" x="30" y="57">Successful HTTP 200 requests per second. Higher is better.</text>
<line class="grid" x1="150.00" y1="92" x2="150.00" y2="388"/>
<text class="muted" x="150.00" y="412" text-anchor="middle">0</text>
<line class="grid" x1="305.00" y1="92" x2="305.00" y2="388"/>
<text class="muted" x="305.00" y="412" text-anchor="middle">20,000</text>
<line class="grid" x1="460.00" y1="92" x2="460.00" y2="388"/>
<text class="muted" x="460.00" y="412" text-anchor="middle">40,000</text>
<line class="grid" x1="615.00" y1="92" x2="615.00" y2="388"/>
<text class="muted" x="615.00" y="412" text-anchor="middle">60,000</text>
<line class="grid" x1="770.00" y1="92" x2="770.00" y2="388"/>
<text class="muted" x="770.00" y="412" text-anchor="middle">80,000</text>
<g data-framework="starlette">
<title>Starlette: 48,956.70 requests/s</title>
<text class="label" x="138" y="127" text-anchor="end">Starlette</text>
<rect class="bar" x="150" y="100" width="379.41" height="44" rx="6"/>
<text class="label" x="539.41" y="127">48,956.70</text>
</g>
<g data-framework="orionis-asgi">
<title>Orionis ASGI: 32,922.97 requests/s</title>
<text class="label" x="138" y="187" text-anchor="end">Orionis ASGI</text>
<rect class="bar" x="150" y="160" width="255.15" height="44" rx="6"/>
<text class="label" x="415.15" y="187">32,922.97</text>
</g>
<g data-framework="litestar">
<title>Litestar: 29,582.52 requests/s</title>
<text class="label" x="138" y="247" text-anchor="end">Litestar</text>
<rect class="bar" x="150" y="220" width="229.26" height="44" rx="6"/>
<text class="label" x="389.26" y="247">29,582.52</text>
</g>
<g data-framework="orionis-rsgi">
