<svg xmlns="http://www.w3.org/2000/svg" width="900" height="496" viewBox="0 0 900 496" role="img" aria-labelledby="title description">
<title id="title">Throughput with 1 worker</title>
<desc id="description">Successful HTTP 200 requests per second. Higher is better.</desc>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
.heading { fill: #f0f6fc; font-size: 17px; font-weight: 600; }
.label { fill: #c9d1d9; font-size: 13px; }
.muted { fill: #8b949e; font-size: 11px; }
.grid { stroke: #30363d; stroke-dasharray: 3 5; }
.bar { fill: #245493; }
</style>
<rect width="900" height="496" rx="8" fill="#0d1117"/>
<text class="heading" x="30" y="32">Throughput with 1 worker</text>
<text class="label" x="30" y="57">Successful HTTP 200 requests per second. Higher is better.</text>
