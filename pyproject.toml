[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "app*",
    "bootstrap*",
    "config*",
    "database*",
    "resources",
    "routes*",
    "storage*",
    "tests*",
    ".venv*",
    ".ruff_cache*",
    ".vscode*",
    ".github*",
    ".docs*",
]

[project]
name = "orionis"
version = "0.756.0"
description = "Orionis Framework — Async-first full-stack framework for modern Python applications."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.14"
license = { text = "MIT" }

authors = [
    { name = "Raul Mauricio Uñate Castro", email = "raulmauriciounate@gmail.com" },
]

keywords = [
    "orionis",
    "async framework",
    "asgi framework",
    "rsgi framework",
    "asyncio",
    "dependency injection",
    "service container",
    "service providers",
    "facades",
    "mvc",
    "full stack framework",
    "web framework",
    "api framework",
    "websockets",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
]

dependencies = [
    "aiocache[redis,memcached]>=0.12.3",
    "aiosqlite>=0.22.1",
    "anyio>=4.15.1",
    "apscheduler>=3.11.3,<4.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1,<51.0",
    "defusedxml>=0.7.1,<1.0",
    "dotty-dict>=1.3.1,<2.0",
    "filelock>=4.0.1",
    "granian[dotenv,pname,reload,uvloop,winloop]>=2.8.3,<3.0",
    "jinja2>=3.1.6,<4.0",
    "markdown>=3.10.3,<4.0",
    "markupsafe>=3.0.3",
    "msgspec>=0.21.1",
    "pendulum>=3.2.0,<4.0",
    "psutil>=7.2.2,<8.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "python-dotenv>=1.2.3,<2.0",
    "redis[hiredis]>=8.1.0",
    "rich>=15.0.0,<16.0",
    "sqlalchemy[asyncio]>=2.0.54,<3.0",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://github.com/orionis-framework/framework"
Documentation = "https://orionis-framework.com/"
Repository = "https://github.com/orionis-framework/framework"

[project.optional-dependencies]
# Cloud storage drivers rely on the official SDK of each platform.
# These packages are NOT installed with the framework; install the
# extra matching the driver you plan to use, e.g. `pip install orionis[s3]`.
s3 = [
    "boto3>=1.43.99",
]
azure = [
    "azure-storage-blob>=12.30.2",
]
gcs = [
    "google-cloud-storage>=3.14.1",
]
storage = [
    "boto3>=1.43.99",
    "azure-storage-blob>=12.30.2",
    "google-cloud-storage>=3.14.1",
]

# Database drivers beyond SQLite (which ships with the framework via
# aiosqlite). Each extra installs BOTH the async driver used by Connection
# and the blocking (sync) driver used by Scheduler
mysql = [
    "aiomysql>=0.3.2",
    "pymysql>=1.2.3",
]
pgsql = [
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.13",
]
oracle = [
    "oracledb>=26.0.0",
]
sqlserver = [
    "aioodbc>=0.5.0",
    "pyodbc>=5.3.0",
]
database = [
    "aiomysql>=0.3.2",
    "pymysql>=1.2.3",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.13",
    "oracledb>=26.0.0",
    "aioodbc>=0.5.0",
    "pyodbc>=5.3.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "ruff>=0.16.8",
]
docs = [
    "pydoctor>=25.10.1",
]
