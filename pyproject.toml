[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "app*",
    "bootstrap*",
    "config*",
    "database*",
    "resources",
    "routes*",
    "storage*",
    "tests*",
    ".venv*",
    ".ruff_cache*",
    ".vscode*",
    ".github*",
    ".docs*",
]

[project]
name = "orionis"
version = "0.756.0"
description = "Orionis Framework — Async-first full-stack framework for modern Python applications."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.14"
license = { text = "MIT" }

authors = [
    { name = "Raul Mauricio Uñate Castro", email = "raulmauriciounate@gmail.com" },
]

keywords = [
    "orionis",
    "async framework",
    "asgi framework",
    "rsgi framework",
    "asyncio",
    "dependency injection",
    "service container",
    "service providers",
    "facades",
    "mvc",
    "full stack framework",
    "web framework",
    "api framework",
    "websockets",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
]

dependencies = [
    "aiocache[redis,memcached]>=0.12.3",
    "aiosqlite>=0.21",
    "apscheduler~=3.11",
    "asyncpg>=0.31.0",
    "cryptography~=48.0",
    "defusedxml~=0.7",
    "dotty-dict~=1.3",
    "granian[dotenv,pname,reload,uvloop,winloop]~=2.7",
    "jinja2~=3.1",
    "markdown~=3.7",
    "msgspec>=0.21.1",
    "pendulum~=3.2",
    "psutil~=7.2",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "python-dotenv~=1.2",
    "redis[hiredis]>=8.0.1",
    "rich~=15.0",
    "sqlalchemy[asyncio]~=2.0",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://github.com/orionis-framework/framework"
Documentation = "https://orionis-framework.com/"
Repository = "https://github.com/orionis-framework/framework"

[project.optional-dependencies]
# Cloud storage drivers rely on the official SDK of each platform.
# These packages are NOT installed with the framework; install the
# extra matching the driver you plan to use, e.g. `pip install orionis[s3]`.
s3 = [
    "boto3>=1.35",
]
azure = [
    "azure-storage-blob>=12.24",
]
gcs = [
    "google-cloud-storage>=2.18",
]
storage = [
    "boto3>=1.35",
    "azure-storage-blob>=12.24",
    "google-cloud-storage>=2.18",
]

# Database drivers beyond SQLite (which ships with the framework via
# aiosqlite). Each extra installs BOTH the async driver used by Connection
# and the blocking (sync) driver used by Scheduler
mysql = [
    "aiomysql>=0.2.0",
    "pymysql>=1.1",
]
pgsql = [
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
]
oracle = [
    "oracledb>=2.5",
]
sqlserver = [
    "aioodbc>=0.5",
    "pyodbc>=5.0",
]
database = [
    "aiomysql>=0.2.0",
    "pymysql>=1.1",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "oracledb>=2.5",
    "aioodbc>=0.5",
    "pyodbc>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "twine>=6.2.0",
    "pyclean>=3.7.0",
]
docs = [
    "pydoctor>=25.10.1",
]
